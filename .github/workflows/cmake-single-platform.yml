name: CMake CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  BUILD_TYPE: Debug

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen and Graphviz
        run: sudo apt update && sudo apt install -y doxygen graphviz

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake g++ ninja-build libboost-all-dev lcov

      - name: Configure CMake (with coverage)
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCODE_COVERAGE=ON

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: |
          cd build
          ctest --output-on-failure

      - name: Generate coverage report
        if: success()
        run: |
          cd build
          # Capture all coverage data
          lcov --capture --directory . --output-file coverage.info

          # Remove unwanted files (like system headers and gtest)
          lcov --remove coverage.info '/usr/*' '*/gtest/*' --output-file coverage.info.cleaned

          # Generate HTML report
          genhtml coverage.info.cleaned --output-directory coverage-report
      

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage-report/
