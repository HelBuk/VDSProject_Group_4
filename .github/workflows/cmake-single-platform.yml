name: CMake CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  BUILD_TYPE: Debug

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen and Graphviz
        run: sudo apt update && sudo apt install -y doxygen graphviz

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake g++ ninja-build libboost-all-dev lcov

      - name: Configure CMake (with coverage)
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCODE_COVERAGE=ON

      - name: Build
        run: cmake --build build

      - name: Run tests manually
        run: |
          cd build
          # Run test binaries directly to ensure .gcda files are generated
          ./src/reachability/VDSProject_reachability || true
          ./src/test/VDSProject_test || true

      - name: Generate coverage report
        run: |
          cd build
          lcov --capture --directory . --output-file coverage.info --rc geninfo_unexecuted_blocks=1 --ignore-errors empty
          lcov --remove coverage.info '/usr/*' '*/gtest/*' --output-file coverage.info.cleaned --ignore-errors unused
          genhtml coverage.info.cleaned --output-directory coverage-report --ignore-errors mismatch

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage-report/
