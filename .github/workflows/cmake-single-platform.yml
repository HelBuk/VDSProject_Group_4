name: CMake CI with Coverage

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  BUILD_TYPE: Debug

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake g++ ninja-build lcov doxygen graphviz

      - name: Configure CMake with coverage enabled
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCODE_COVERAGE=ON

      - name: Build project
        run: cmake --build build

      - name: Run tests manually to generate .gcda files
        run: |
          cd build
          find . -type f -executable -name 'VDSProject_*' -exec {} \; || true

      - name: Generate coverage report (same as CLion command)
        run: |
          cd build
          lcov --rc geninfo_unexecuted_blocks=1 --capture --directory . --output-file coverage.info --ignore-errors mismatch
          lcov --remove coverage.info '/usr/*' '*/gtest/*' --output-file coverage.info.cleaned --ignore-errors unused
          genhtml coverage.info.cleaned --ignore-errors mismatch --quiet --output-directory coverage-report

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage-report
